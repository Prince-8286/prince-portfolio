<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Quiz game architecture">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#D4A574" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="560" fill="#0b0c10"/>
  <g font-family="monospace" text-anchor="middle">
    <rect x="220" y="24" width="360" height="72" rx="10" fill="#14161c" stroke="#2a2e37"/>
    <text x="400" y="52" font-size="15" fill="#F4F1EA">Question bank</text>
    <text x="400" y="74" font-size="12" fill="#A8A59C">topics · difficulty levels</text>
    <line x1="400" y1="96" x2="400" y2="128" stroke="#D4A574" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="220" y="128" width="360" height="72" rx="10" fill="#14161c" stroke="#D4A574"/>
    <text x="400" y="156" font-size="15" fill="#F4F1EA">Randomizer + difficulty</text>
    <text x="400" y="178" font-size="12" fill="#A8A59C">fair shuffling · progression</text>
    <line x1="400" y1="200" x2="400" y2="232" stroke="#D4A574" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="220" y="232" width="360" height="72" rx="10" fill="#14161c" stroke="#D4A574"/>
    <text x="400" y="260" font-size="15" fill="#F4F1EA">Game loop</text>
    <text x="400" y="282" font-size="12" fill="#A8A59C">timer · real-time scoring</text>
    <line x1="280" y1="304" x2="200" y2="342" stroke="#D4A574" stroke-width="1.5" marker-end="url(#arr)"/>
